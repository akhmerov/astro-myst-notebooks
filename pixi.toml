[workspace]
name = "astro-myst-notebooks"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
nodejs = "24.*"
python = ">=3.11,<3.14"
nbclient = ">=0.10,<0.11"
nbformat = ">=5.10,<6"
ipykernel = ">=6,<8"
packaging = ">=24,<27"
git = "*"

[tasks]
install = "npm ci"
build = { cmd = "npm run build", depends-on = ["install"] }
check = { cmd = "npm run check", depends-on = ["install"] }
test = { cmd = "npm test", depends-on = ["install"] }
pack = { cmd = "npm pack", depends-on = ["install"] }
